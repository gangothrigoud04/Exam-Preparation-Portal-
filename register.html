<!DOCTYPE html>
<html>
<head>
<title>Student Registration</title>
<!-- External CSS -->
<link rel="stylesheet" href="style.css">
<!-- Internal CSS -->
<style>
body{
    font-family: Arial;
    background: lightblue;
}
form{
    background: white;
    padding: 20px;
    width: 350px;
}
input{
    margin: 5px;
    padding: 6px;
}
</style>
<script>
function validateForm(){
    let name = document.getElementById("name").value;
    let roll = document.getElementById("roll").value;
    let email = document.getElementById("email").value;
    let mobile = document.getElementById("mobile").value;
    let username = document.getElementById("username").value;
    let password = document.getElementById("password").value;
    if(name==""){
        alert("Please Enter Full Name");
        return false;
    }
    if(isNaN(roll) || roll==""){
        alert("Roll Number should contain only numbers");
        return false;
    }
    if(email.indexOf("@")==-1 || email.indexOf(".")==-1){
        alert("Please Enter Valid Email");
        return false;
    }
    if(isNaN(mobile) || mobile.length!=10){
        alert("Mobile Number must be 10 digits");
        return false;
    }
    if(username.length<5){
        alert("Username must be at least 5 characters");
        return false;
    }
    if(password.length<6){
        alert("Password must be at least 6 characters");
        return false;
    }
    alert("Registration Successful");
    return true;
}
</script>
</head>
<body>
<center>
<img src="https://static.vecteezy.com/system/resources/previews/046/803/190/non_2x/study-logo-design-with-creative-modern-concept-and-business-premium-golden-vector.jpg"
width="80" height="80">
<h1 style="color: darkblue;">Exam Preparation Portal</h1>
<h2>Student Registration</h2>
<form action="login.html" onsubmit="return validateForm()">
<p>
<b>Full Name:</b><br>
<input type="text" id="name" placeholder="Enter Name" required>
</p>
<p>
<b>Roll Number:</b><br>
<input type="text" id="roll" placeholder="Enter Roll Number" required>
</p>
<p>
<b>Email:</b><br>
<input type="email" id="email" placeholder="Enter Email" required>
</p>
<p>
<b>Mobile Number:</b><br>
<input type="tel" id="mobile" placeholder="Enter Mobile Number" required>
</p>
<p>
<b>Username:</b><br>
<input type="text" id="username" placeholder="Create Username" required>
</p>
<p>
<b>Password:</b><br>
<input type="password" id="password" placeholder="Create Password" required>
</p>
<input type="submit" value="Register">
<input type="reset" value="Reset">
</form>
<p>
Already Registered?
<a href="login.html">Login Here</a>
</p>
<a href="index.html">Back to Home</a>
<hr>
<p><b>© 2026 Exam Preparation Portal</b></p>
</center>
</body>
</html>
