<!DOCTYPE html>
<html>
<head>
<title>Student Registration</title>
</head>
<body>
<center>
<img src="https://static.vecteezy.com/system/resources/previews/046/803/190/non_2x/study-logo-design-with-creative-modern-concept-and-business-premium-golden-vector.jpg"
alt="Study Logo" width="80" height="80">
<h1>Exam Preparation Portal</h1>
<hr>
<h2>Student Registration</h2>
<form action="login.html">
<p><b>Full Name:</b><br>
<input type="text" name="name" required></p>
<p><b>Roll Number:</b><br>
<input type="text" name="roll" required></p>
<p><b>Email:</b><br>
<input type="email" name="email" required></p>
<p><b>Mobile:</b><br>
<input type="tel" name="mobile" pattern="[0-9]{10}" required></p>
<p><b>Gender:</b><br>
<input type="radio" name="gender" required> Male
<input type="radio" name="gender"> Female
<input type="radio" name="gender"> Other</p>
<p><b>Date of Birth:</b><br>
<input type="date" name="dob" required></p>
<p><b>Course:</b><br>
<select name="course" required>
<option value="">Select Course</option>
<option>B.Tech</option><option>BCA</option>
<option>B.Sc</option><option>M.Tech</option>
</select></p>
<p><b>Username:</b><br>
<input type="text" name="username" required></p>
<p><b>Password:</b><br>
<input type="password" name="password" required></p>
<p><b>Address:</b><br>
<textarea rows="3" required></textarea></p>
<p><b>Skills:</b><br>
<input type="checkbox"> HTML
<input type="checkbox"> CSS
<input type="checkbox"> Java</p>
<p><input type="checkbox" required> I agree to Terms and Conditions</p>
<input type="submit" value="Register">
<input type="reset" value="Reset">
</form>
<p>Already Registered? <a href="login.html">Login Here</a></p>
<a href="index.html"><button>Back to Home</button></a>
<hr>
<p><b>© 2026 Exam Preparation Portal</b></p>
</center>
</body>
</html>
