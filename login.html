<!DOCTYPE html>
<html>
<head>
    <title>Student Login - Exam Preparation Portal</title>
</head>

<body bgcolor="white">

<center>

<img src="https://static.vecteezy.com/system/resources/previews/046/803/190/non_2x/study-logo-design-with-creative-modern-concept-and-business-premium-golden-vector.jpg"
alt="Study Logo"
width="100"
height="100">
<h1 style="margin-top:-90px;"></h1>

<hr width="80%"><br>

<h1>Exam Preparation Portal</h1>

<hr width="80%">

<h2>Student Login</h2>

<form action="index.html">

<table cellpadding="10">

<tr>
    <td><b>Username</b></td>
    <td>
        <input type="text"
               name="username"
               placeholder="Enter Username"
               required>
    </td>
</tr>

<tr>
    <td><b>Email</b></td>
    <td>
        <input type="email"
               name="email"
               placeholder="Enter Email"
               required>
    </td>
</tr>

<tr>
    <td><b>Password</b></td>
    <td>
        <input type="password"
               name="password"
               placeholder="Enter Password"
               required
               minlength="6">
    </td>
</tr>

<tr>
    <td colspan="2">
        <input type="checkbox">
        Remember Me
    </td>
</tr>

<tr>
    <td align="center">
        <input type="submit" value="Login">
    </td>

    <td align="center">
        <input type="reset" value="Reset">
    </td>
</tr>

</table>

</form>

</center>

</body>
</html>
