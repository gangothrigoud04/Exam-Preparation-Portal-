<!DOCTYPE html>
<html>
<head>
    <title>Exam Preparation Portal - Catalogue</title>
    <!-- External CSS -->
    <link rel="stylesheet" href="style.css">
    <!-- Internal CSS -->
    <style>
        .catalogue {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }
        .item {
            background-color: white;
            width: 220px;
            min-height: 150px;
            padding: 20px;
            border: 1px solid #999;
            box-sizing: border-box;
        }
        .item h3 {
            color: darkblue;
        }
        .item button {
            background-color: darkblue;
            color: white;
            padding: 10px;
            border: none;
            cursor: pointer;
        }
    </style>
</head>
<body>
<center>
<img src="https://static.vecteezy.com/system/resources/previews/046/803/190/non_2x/study-logo-design-with-creative-modern-concept-and-business-premium-golden-vector.jpg"
alt="Study Logo" width="90" height="90">
<hr>
<h1>Exam Preparation Portal</h1>
<h3>Prepare Smarter • Practice Better • Score Higher</h3>
<hr>
<a href="index.html">Home</a> |
<a href="login.html">Login</a> |
<a href="register.html">Register</a> |
<a href="catalogue.html">Catalogue</a>
<hr>
<h2 style="font-size: 30px; color: darkblue;">
📚 Exam Preparation Catalogue
</h2>
<p>Select a resource to start your preparation.</p>
<div class="catalogue" id="catalogue">
</div>
<br><br>
<a href="index.html">← Back to Home</a>
</center>
<!-- JavaScript -->
<script>
// WEEK 9 - Fetch API to parse JSON data
fetch("resources.json")
.then(response => response.json())
.then(data => {
    let catalogue = document.getElementById("catalogue");
    data.resources.forEach(resource => {
        catalogue.innerHTML += `
            <div class="item">
                <h3>📚 ${resource.name}</h3>
                <p>${resource.description}</p>
                <button onclick="selectResource('${resource.name}')">
                    View
                </button>
            </div>
        `;
    });
})
.catch(error => {
    alert("Error loading resources");

});
function selectResource(resource) {
    alert(resource + " selected!");

}
</script>
</body>
</html>
